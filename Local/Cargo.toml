[package]
name = "local"
version = "0.1.0"
edition = "2021"
[dependencies]
mz-module-support = { path = "../ModuleSupport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
[[bin]]
name = "local-module"
path = "src/main.rs"
