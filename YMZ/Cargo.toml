[package]
name = "ymz"
version = "0.2.0"
edition = "2021"
autolib = false
autobins = false

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.20"
md-5 = "0.10"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "ymz-module"
path = "src/bin/ymz-module.rs"
