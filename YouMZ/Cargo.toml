[package]
name = "youmz"
version = "0.1.0"
edition = "2021"
description = "Ультралегковесный headless-клиент YouTube Music как сервис (MPRIS v2)"
autolib = false
autobins = false
autoexamples = false

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
data-encoding = "2"
rustypipe = { version = "0.11.4", features = ["userdata"] }
futures-util = "0.3"
tokio-tungstenite = "0.30"
tempfile = "3"
mz-module-support = { version = "0.1.0", path = "../ModuleSupport" }
[[bin]]
name = "youmz-module"
path = "src/bin/youmz-module.rs"
