[package]
name = "youmz"
version = "0.1.0"
edition = "2021"
description = "Ультралегковесный headless-клиент YouTube Music как сервис (MPRIS v2)"
autolib = false
autobins = false
autoexamples = false

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.31", default-features = false }
sha1 = "0.10"
data-encoding = "2"
urlencoding = "2.1.3"
rustypipe = { version = "0.11.4", features = ["userdata"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.31", default-features = false, features = ["bundled"] }



[[bin]]
name = "youmz-module"
path = "src/bin/youmz-module.rs"
