name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: musiczero-linux-x64
          - os: windows-2022
            artifact: musiczero-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux binaries
        if: runner.os == 'Linux'
        run: cargo build --workspace --release --locked
      - name: Build Windows binaries
        if: runner.os == 'Windows'
        run: cargo build --workspace --release --no-default-features --locked
      - name: Package Linux release
        if: runner.os == 'Linux' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          mkdir -p dist/musiczero/modules/{ymz,youmz,local,icecast}
          cp target/release/mz README.md README_RU.md LICENSE dist/musiczero/
          cp modules/ymz/module.json target/release/ymz-module dist/musiczero/modules/ymz/
          cp modules/youmz/module.json target/release/youmz-module dist/musiczero/modules/youmz/
          cp modules/local/module.json modules/local/README.md target/release/local-module dist/musiczero/modules/local/
          cp modules/icecast/module.json modules/icecast/README.md target/release/icecast-module dist/musiczero/modules/icecast/
          tar -czf musiczero-linux-x64.tar.gz -C dist musiczero
      - name: Package Windows release
        if: runner.os == 'Windows' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/musiczero/modules/ymz,dist/musiczero/modules/youmz,dist/musiczero/modules/local,dist/musiczero/modules/icecast | Out-Null
          Copy-Item target/release/mz.exe,README.md,README_RU.md,LICENSE dist/musiczero/
          Copy-Item modules/ymz/module.json,target/release/ymz-module.exe dist/musiczero/modules/ymz/
          Copy-Item modules/youmz/module.json,target/release/youmz-module.exe dist/musiczero/modules/youmz/
          Copy-Item modules/local/module.json,modules/local/README.md,target/release/local-module.exe dist/musiczero/modules/local/
          Copy-Item modules/icecast/module.json,modules/icecast/README.md,target/release/icecast-module.exe dist/musiczero/modules/icecast/
          Compress-Archive -Path dist/musiczero -DestinationPath musiczero-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: ${{ matrix.artifact }}
          path: musiczero-*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: musiczero-*
          merge-multiple: true
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            musiczero-linux-x64.tar.gz
            musiczero-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish automatic build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Automatic build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Built from commit ${{ github.sha }} after both platform builds passed.
          files: |
            musiczero-linux-x64.tar.gz
            musiczero-windows-x64.zip
          fail_on_unmatched_files: true
