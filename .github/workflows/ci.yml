name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: musiczero-linux-x64
          - os: ubuntu-24.04-arm
            artifact: musiczero-linux-arm64-alpha
          - os: windows-2022
            artifact: musiczero-windows-x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            artifact: musiczero-windows-arm64-alpha
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libsqlite3-dev ffmpeg openssl dbus
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.os == 'windows-11-arm' && 'stable-aarch64-pc-windows-msvc' || 'stable' }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test Linux workspace and installer
        if: runner.os == 'Linux'
        run: |
          cargo test --workspace --locked
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test Android AAudio backend on Linux
        if: runner.os == 'Linux'
        run: |
          cargo build -p mz -p local -p icecast --no-default-features --features mz/aaudio-output --locked --target-dir target/aaudio
          MZ_TEST_PROFILE=aaudio/debug python3 tests/smoke_aaudio.py
      - name: Test Windows workspace
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-default-features --locked --target '${{ matrix.target }}'
      - name: Build Linux binaries
        if: runner.os == 'Linux'
        run: cargo build --workspace --release --locked
      - name: Test Linux playback and seeking
        if: runner.os == 'Linux'
        env:
          MZ_TEST_PROFILE: release
        run: |
          python3 tests/smoke_seek.py
          python3 tests/smoke_wave.py
          python3 tests/smoke_history.py
          python3 tests/smoke_config.py
          python3 tests/smoke_service.py
          python3 tests/smoke_modules.py
          python3 tests/smoke_https.py
      - name: Build Windows binaries
        if: runner.os == 'Windows'
        run: cargo build --workspace --release --no-default-features --locked --target '${{ matrix.target }}'
      - name: Package Linux release
        if: runner.os == 'Linux' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          mkdir -p dist/musiczero/modules/{ymz,youmz,local,icecast}
          cp target/release/mz README.md README_RU.md LICENSE dist/musiczero/
          cp modules/ymz/module.json target/release/ymz-module dist/musiczero/modules/ymz/
          cp modules/youmz/module.json target/release/youmz-module dist/musiczero/modules/youmz/
          cp modules/local/module.json modules/local/README.md target/release/local-module dist/musiczero/modules/local/
          cp modules/icecast/module.json modules/icecast/README.md target/release/icecast-module dist/musiczero/modules/icecast/
          tar -czf '${{ matrix.artifact }}.tar.gz' -C dist musiczero
      - name: Package Windows release
        if: runner.os == 'Windows' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/musiczero/modules/ymz,dist/musiczero/modules/youmz,dist/musiczero/modules/local,dist/musiczero/modules/icecast | Out-Null
          $binaries = 'target/${{ matrix.target }}/release'
          Copy-Item "$binaries/mz.exe",README.md,README_RU.md,LICENSE dist/musiczero/
          Copy-Item modules/ymz/module.json,"$binaries/ymz-module.exe" dist/musiczero/modules/ymz/
          Copy-Item modules/youmz/module.json,"$binaries/youmz-module.exe" dist/musiczero/modules/youmz/
          Copy-Item modules/local/module.json,modules/local/README.md,"$binaries/local-module.exe" dist/musiczero/modules/local/
          Copy-Item modules/icecast/module.json,modules/icecast/README.md,"$binaries/icecast-module.exe" dist/musiczero/modules/icecast/
          $expectedMachine = if ('${{ matrix.target }}'.StartsWith('aarch64')) { 0xAA64 } else { 0x8664 }
          foreach ($binary in Get-ChildItem dist/musiczero -Recurse -Filter '*.exe') {
            $bytes = [System.IO.File]::ReadAllBytes($binary.FullName)
            $pe = [System.BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [System.BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne $expectedMachine) { throw "Wrong architecture: $($binary.Name)" }
          }
          & ./dist/musiczero/mz.exe modules
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows modules failed' }
          Compress-Archive -Path dist/musiczero -DestinationPath '${{ matrix.artifact }}.zip'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: ${{ matrix.artifact }}
          path: musiczero-*
          if-no-files-found: error

  termux-alpha:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bindings generator dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: termux-arm64-alpha
      - name: Cross-build Android ARM64 (API 26)
        run: ./scripts/build-termux.sh
      - name: Check Android architecture and dependencies
        run: python3 tests/check_android.py
      - name: Package Termux alpha
        run: |
          mkdir -p dist/musiczero/modules/{ymz,youmz,local,icecast}
          cp target/aarch64-linux-android/release/mz README.md README_RU.md LICENSE dist/musiczero/
          for module in ymz youmz local icecast; do
            cp modules/$module/module.json target/aarch64-linux-android/release/$module-module dist/musiczero/modules/$module/
            if [ -f modules/$module/README.md ]; then
              cp modules/$module/README.md dist/musiczero/modules/$module/
            fi
          done
          tar -czf musiczero-termux-arm64-alpha.tar.gz -C dist musiczero
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: musiczero-termux-arm64-alpha
          path: musiczero-termux-arm64-alpha.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, termux-alpha]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: musiczero-*
          merge-multiple: true
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            musiczero-*.tar.gz
            musiczero-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Publish automatic build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Automatic build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Built from commit ${{ github.sha }} after Linux x64/ARM64, Windows x64/ARM64 and Android ARM64 builds passed. ARM64 archives are alpha; Android device audio is not hardware-tested.
          files: |
            musiczero-*.tar.gz
            musiczero-*.zip
          fail_on_unmatched_files: true
