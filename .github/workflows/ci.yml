name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            artifact: musiczero-linux-x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            artifact: musiczero-linux-arm64-alpha
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            artifact: musiczero-windows-x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            artifact: musiczero-windows-arm64-alpha

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Системные зависимости Linux (компиляция и кросс-компиляция)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libsqlite3-dev ffmpeg openssl dbus zip clang lld

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      # Утилита кросс-компиляции MSVC для таргетов Windows
      - name: Install cargo-xwin
        if: matrix.platform == 'windows'
        run: cargo install --locked cargo-xwin

      # --- ТЕСТЫ LINUX (только на x64 хосте) ---
      - name: Test Linux workspace and installer
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          cargo test --workspace --locked
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test Android AAudio backend on Linux
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          cargo build -p mz -p local -p icecast --no-default-features --features mz/aaudio-output --locked --target-dir target/aaudio
          MZ_TEST_PROFILE=aaudio/debug python3 tests/smoke_aaudio.py

      # --- СБОРКА LINUX ---
      - name: Build Linux x64
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: cargo build --workspace --release --locked

      - name: Build Linux ARM64
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Test Linux playback and seeking (x64 only)
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        env:
          MZ_TEST_PROFILE: release
        run: |
          python3 tests/smoke_seek.py
          python3 tests/smoke_wave.py
          python3 tests/smoke_history.py
          python3 tests/smoke_config.py
          python3 tests/smoke_service.py
          python3 tests/smoke_modules.py
          python3 tests/smoke_https.py

      # --- СБОРКА WINDOWS (Кросс-компиляция через cargo-xwin) ---
      - name: Build Windows binaries
        if: matrix.platform == 'windows'
        run: cargo xwin build --workspace --release --no-default-features --locked --target ${{ matrix.target }}

      # --- УПАКОВКА LINUX ---
      - name: Package Linux release
        if: matrix.platform == 'linux' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          TARGET_DIR="${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}"
          mkdir -p dist/musiczero/modules/{ymz,youmz,local,icecast}
          cp "$TARGET_DIR/mz" README.md README_RU.md LICENSE dist/musiczero/
          cp modules/ymz/module.json "$TARGET_DIR/ymz-module" dist/musiczero/modules/ymz/
          cp modules/youmz/module.json "$TARGET_DIR/youmz-module" dist/musiczero/modules/youmz/
          cp modules/local/module.json modules/local/README.md "$TARGET_DIR/local-module" dist/musiczero/modules/local/
          cp modules/icecast/module.json modules/icecast/README.md "$TARGET_DIR/icecast-module" dist/musiczero/modules/icecast/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist musiczero

      # --- УПАКОВКА WINDOWS (Bash + zip вместо PowerShell) ---
      - name: Package Windows release
        if: matrix.platform == 'windows' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p dist/musiczero/modules/{ymz,youmz,local,icecast}
          cp "$BIN_DIR/mz.exe" README.md README_RU.md LICENSE dist/musiczero/
          cp modules/ymz/module.json "$BIN_DIR/ymz-module.exe" dist/musiczero/modules/ymz/
          cp modules/youmz/module.json "$BIN_DIR/youmz-module.exe" dist/musiczero/modules/youmz/
          cp modules/local/module.json modules/local/README.md "$BIN_DIR/local-module.exe" dist/musiczero/modules/local/
          cp modules/icecast/module.json modules/icecast/README.md "$BIN_DIR/icecast-module.exe" dist/musiczero/modules/icecast/

          # Валидация заголовка PE через Python
          python3 - << 'EOF'
          import os, struct, sys

          target = "${{ matrix.target }}"
          expected = 0xAA64 if target.startswith("aarch64") else 0x8664

          for root, _, files in os.walk("dist/musiczero"):
              for file in files:
                  if file.endswith(".exe"):
                      path = os.path.join(root, file)
                      with open(path, "rb") as f:
                          data = f.read()
                      pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
                      machine = struct.unpack_from("<H", data, pe_offset + 4)[0]
                      if machine != expected:
                          print(f"Error: {file} architecture mismatch! Got {hex(machine)}, expected {hex(expected)}")
                          sys.exit(1)
          EOF

          (cd dist && zip -r "../${{ matrix.artifact }}.zip" musiczero)

      # В Forgejo стабильно работает upload-artifact@v3
      - uses: actions/upload-artifact@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: ${{ matrix.artifact }}
          path: musiczero-*
          if-no-files-found: error

  termux-alpha:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bindings generator dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: termux-arm64-alpha
      - name: Cross-build Android ARM64 (API 26)
        run: ./scripts/build-termux.sh
      - name: Check Android architecture and dependencies
        run: python3 tests/check_android.py
      - name: Package Termux alpha
        run: |
          mkdir -p dist/musiczero/modules/{ymz,youmz,local,icecast}
          cp target/aarch64-linux-android/release/mz README.md README_RU.md LICENSE dist/musiczero/
          for module in ymz youmz local icecast; do
            cp modules/$module/module.json target/aarch64-linux-android/release/$module-module dist/musiczero/modules/$module/
            if [ -f modules/$module/README.md ]; then
              cp modules/$module/README.md dist/musiczero/modules/$module/
            fi
          done
          tar -czf musiczero-termux-arm64-alpha.tar.gz -C dist musiczero
      - uses: actions/upload-artifact@v3
        if: github.event_name == 'push'
        with:
          name: musiczero-termux-arm64-alpha
          path: musiczero-termux-arm64-alpha.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, termux-alpha]
    runs-on: ubuntu-24.04
    steps:
      # Скачивание артефактов (v3 скачивает каждый артефакт в поддиректорию с именем артефакта)
      - uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Publish Release to Forgejo
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          IS_PRERELEASE=false
          RELEASE_TITLE="Release $TAG_NAME"
          BODY="Automated release from commit ${GITHUB_SHA}"

          if [[ "$GITHUB_REF" =~ refs/heads/.* ]]; then
            TAG_NAME="build-${GITHUB_RUN_NUMBER}"
            RELEASE_TITLE="Automatic build #${GITHUB_RUN_NUMBER}"
            IS_PRERELEASE=true
            BODY="Built from commit ${GITHUB_SHA}. Linux x64/ARM64, Windows x64/ARM64 and Android ARM64 builds."
          fi

          # 1. Создание релиза через Forgejo API
          RELEASE_DATA=$(curl -s -f -X POST "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "tag_name": "${TAG_NAME}",
            "name": "${RELEASE_TITLE}",
            "body": "${BODY}",
            "prerelease": ${IS_PRERELEASE},
            "target_commitish": "${GITHUB_SHA}"
          }
          EOF
          )

          RELEASE_ID=$(echo "$RELEASE_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "Created release ID: $RELEASE_ID"

          # 2. Загрузка бинарных ассетов
          for file in dist-release/*; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            curl -s -f -X POST "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${filename}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file"
          done