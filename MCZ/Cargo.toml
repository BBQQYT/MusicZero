[package]
name = "mcz"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
rodio = { version = "0.21.1", default-features = false, features = ["symphonia-all"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
