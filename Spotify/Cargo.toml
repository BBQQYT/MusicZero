[package]
name = "spotify"
version = "0.1.0"
edition = "2021"
autolib = false
autobins = false
description = "MusicZero Spotify provider"

[dependencies]
mz-module-support = { path = "../ModuleSupport" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
url = "2"
env_logger = "0.11"
log = "0.4"
# vergen-gitcl 1.0.8 (via librespot-core) expects vergen 9.0.x, which keeps
# vergen-lib at 0.1; vergen 9.1 switched to vergen-lib 9 and breaks its build.
vergen = "~9.0.6"
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-audio = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }

[[bin]]
name = "spotify-module"
path = "src/bin/spotify-module.rs"
